<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- Sayfa açık ve koyu temayı kendisi destekliyor: mobil Chrome / Samsung Internet'in
         "karanlık mod"u sayfayı kendi kafasına göre ters çevirmesin (beyaz tema lacivert görünüyordu) -->
    <meta name="color-scheme" content="light dark" />
    <!-- Başka sitelere geçerken hangi sayfadan gelindiği söylenmez -->
    <meta name="referrer" content="no-referrer" />
    <title>Ders Çalışma Takibi</title>
    <!-- Simge ve PWA manifesti: tarayıcı uygulamayı "yükle" olarak sunabilsin -->
    <link rel="icon" href="icon.svg" type="image/svg+xml" />
    <link rel="manifest" href="manifest.webmanifest" />
    <!-- iPhone/iPad (Safari) manifestteki simgeyi kullanmaz: ana ekran simgesi ve tam ekran açılış buradan gelir -->
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Ders Takip" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <!-- Tarayıcı çubuğunun rengi: temanın zemin rengiyle aynı (aşağıdaki betik ayarlar) -->
    <meta name="theme-color" content="#0c0f14" />
    <!-- Tema, sayfa çizilmeden önce ayarlanır: açık temada koyu bir an görünmez -->
    <script>
      (function () {
        // Başka bir site uygulamayı görünmez bir çerçevenin içine koyup tıklatmaya çalışırsa (clickjacking)
        // sayfa çizilmez. GitHub Pages "frame-ancestors" başlığı ekletmediği için bu betik onun yerini tutar.
        if (window.top !== window.self) {
          document.documentElement.style.display = "none";
          return;
        }
        var t = null;
        try {
          t = localStorage.getItem("tema");
        } catch (e) {}
        // Dört tema: Gece (dark), Kâğıt (light), Neon (neon), Pastel (pastel). Liste src/lib/theme.js ile aynı.
        var bars = { dark: "#0c0f14", light: "#f4f5f7", neon: "#0d0b1e", pastel: "#eef2f9" };
        var darkThemes = { dark: 1, neon: 1 };
        if (!bars[t]) {
          t = window.matchMedia("(prefers-color-scheme: dark)").matches
            ? "dark"
            : "light";
        }
        // Tarayıcı sayfayı zorla karartıyorsa (Chrome/Samsung "karanlık mod") koyu temayla aç:
        // açık tema ters çevrilince yazılar altın-bej görünüyor. Ayrıntı: src/lib/theme.js
        try {
          var p = document.createElement("div");
          p.style.cssText =
            "position:absolute;visibility:hidden;color-scheme:light;background-color:Canvas";
          document.documentElement.appendChild(p);
          var c = getComputedStyle(p).backgroundColor.match(/\d+/g);
          p.remove();
          if (c && c.length >= 3 && (+c[0] + +c[1] + +c[2]) / 3 < 100 && !darkThemes[t]) t = "dark";
        } catch (e) {}
        document.documentElement.dataset.theme = t;
        // Hafif mod (Ayarlar → Görünüm): src/lib/lite.js ile aynı anahtar
        try {
          if (localStorage.getItem("hafif-mod") === "1") document.documentElement.setAttribute("data-lite", "");
        } catch (e) {}
        var m = document.querySelector('meta[name="theme-color"]');
        if (m) m.content = bars[t];
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>

# Uygulamayı derleyip GitHub Pages'e yayınlar
name: GitHub Pages

on:
  push:
    branches: [master, pwa]
  workflow_dispatch:

# Varsayılan: hiçbir yetki yok. Her iş yalnızca ihtiyacı olanı alır (en az yetki ilkesi).
permissions: {}

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # Eylemler etiketle değil commit özetiyle (SHA) sabitlenir: etiket sonradan başka koda
      # taşınsa bile buradaki kod değişmez (tedarik zinciri saldırısına karşı). Dependabot günceller.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Depo erişim anahtarı diske yazılmasın: derleme adımlarının ona ihtiyacı yok
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Bilinen ciddi açığı olan bir bağımlılık varsa yayın durur
      - run: npm audit --audit-level=high
      - run: npm test
      - run: npm run build
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: client/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
